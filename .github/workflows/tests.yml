name: Offline release checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_OPENAI: "0"
      RUN_LIVE_LLM: ""
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[live,dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/run_smoke_test.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.smoke.yml up --build --abort-on-container-exit --exit-code-from smoke
      - if: always()
        run: docker compose -f docker-compose.smoke.yml down -v
