services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  fgf-pipeline:
    build: .
    image: fgf-pipeline:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/gcloud/application_default_credentials.json}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
    volumes:
      - ${RODI_DIR:-./data}:/data:ro
      - ${OUTPUT_DIR:-./outputs}:/outputs
      - ${GOOGLE_GCLOUD_CONFIG_DIR:-./.gcloud}:/gcloud:ro
    command: ["python", "scripts/run_pipeline.py", "--config", "configs/openai_best_fol_default.yaml"]
